<text class="note" x="48" y="897">1. Solid paths reproduce the Figure 2 current-summing core: Va=Vb, P1=P2=P3 and R1=R2.</text>
<text class="note" x="48" y="917">2. N=8 gives PTAT_WEIGHT=11.1612 and VREF_SCALE=0.412 in the current default, not the Figure 5 N=100 resistor set.</text>
<text class="note" x="48" y="937">3. Xopamp and the autonomous startup network must be reviewed as implementation choices, not as transistor-exact paper replicas.</text>
