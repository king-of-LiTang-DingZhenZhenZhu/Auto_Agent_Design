<text class="legend" x="350" y="834">implementation adaptation</text>
<text class="note" x="48" y="862">1. CLK low precharges P, Q, X and Y to VDD; CLK high enables M1/M2/M7 regeneration.</text>
<text class="note" x="48" y="882">2. For vip &gt; vin, P discharges first, X/outn resolves low and Y/outp resolves high.</text>
<text class="note" x="48" y="902">3. MOS body terminals are listed beside devices and are validated even when not drawn as separate wires.</text>
